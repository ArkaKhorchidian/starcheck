[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "starcheck"
version = "0.1.0"
description = "Are a GitHub repo's stars real? Spot bought stars: empty throwaway accounts, bursts and batches."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arka Khorchidian" }]
requires-python = ">=3.9"
dependencies = ["rich>=13"]
keywords = ["github", "stars", "fake-stars", "stargazers", "open-source", "supply-chain", "security", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development",
  "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
starcheck = "starcheck.cli:main"

[project.urls]
Homepage = "https://github.com/ArkaKhorchidian/starcheck"
Issues = "https://github.com/ArkaKhorchidian/starcheck/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/starcheck"]

[tool.hatch.build.targets.sdist]
exclude = ["docs", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
